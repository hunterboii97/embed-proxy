<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="origin">
<title>player</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23000' stroke='%23333' stroke-width='2'/%3E%3Cpath d='M24 18v28l22-14z' fill='%23fff'/%3E%3C/svg%3E">

<!-- Vendored locally: no CDN, no third-party requests -->
<link rel="stylesheet" href="/player-assets/vendor/styles/default/theme.css">
<link rel="stylesheet" href="/player-assets/vendor/styles/default/layouts/video.css">
<link rel="stylesheet" href="/player-assets/theme.css">

<script>
  // Marks the document when framed, exactly like the original.
  if (window.top !== window.self) document.documentElement.dataset.embedded = "";

  // Shell-first: the page paints with this config and immediately asks the
  // same route (?resolve=1) for the stream, tokens, tier and ads. The stream
  // URL is filled in by that resolve call, never by the HTML itself.
  window.__YUME_PLAYER_CONFIG__ = {
    src: '{{STREAM_URL}}',
    tracks: {{RAW_TRACKS}} || [],
    ads: {{ADS_CONFIG}},
    fallbacks: {{FALLBACKS}},
    tier: {{EMBED_TIER}},
    telemetry: {{TELEMETRY_JSON}},
    intro: {{INTRO_JSON}},
    outro: {{OUTRO_JSON}},
    resolve: {{RESOLVE_JSON}}
  };
</script>

<style>
  /* Critical skeleton styles: paint before any external asset lands. */
  html, body { margin: 0; height: 100%; background: #000; color: #fff; }
  #app { height: 100%; }
  .strmcx-boot {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px;
    background: #000; color: #a1a1aa;
    font: 500 13px/1.4 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .strmcx-boot__ring {
    width: 32px; height: 32px; border-radius: 50%;
    border: 2px solid rgb(255 255 255 / 0.12); border-top-color: #fff;
    animation: strmcx-boot-spin 0.8s linear infinite;
  }
  .strmcx-boot__label {
    margin: 0; font-size: 11px; letter-spacing: 0.14em;
    text-transform: uppercase; color: #71717a;
  }
  @keyframes strmcx-boot-spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .strmcx-boot__ring { animation-duration: 2.4s; } }
</style>

<!--
  Vidstack hardcodes three jsdelivr URLs:
    - media-icons     static import  -> intercepted by this import map
    - media-captions  dynamic import -> intercepted by this import map
    - hls.js          lazily loaded  -> the URL in
      vendor/vidstack/providers/vidstack-hls-*.js was repointed to the
      vendored hls bundle. Vidstack injects it once; there is deliberately no
      manual <script> tag here, because its loader treats an existing tag as
      "already loaded" and would fetch a second copy.
  A fourth (dashjs) is only fetched if you play a DASH source.
-->
<script type="importmap">
{
  "imports": {
    "https://cdn.jsdelivr.net/npm/media-icons@1.1.5/dist/cdn.js/+esm": "/player-assets/vendor/media-icons.js",
    "https://cdn.jsdelivr.net/npm/media-captions@1.0.4/dist/prod.js/+esm": "/player-assets/vendor/media-captions.js"
  }
}
</script>
</head>
<body>

<main id="app">
  <div class="strmcx-boot" role="status" aria-live="polite">
    <span class="strmcx-boot__ring" aria-hidden="true"></span>
    <p class="strmcx-boot__label">Loading stream…</p>
  </div>
</main>

<!-- Vidstack: registers the <media-*> custom elements. Must load before core.js
     creates them, otherwise the elements stay inert and never upgrade. -->
<script type="module" src="/player-assets/vendor/vidstack/vidstack.js"></script>
<script type="module" src="/player-assets/player.js"></script>
</body>
</html>
