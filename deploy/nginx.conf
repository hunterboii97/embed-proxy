# MikazaAPI — dedicated-VPS nginx config
#
# Full replacement for /etc/nginx/nginx.conf on a box that only serves Mikaza.
# Back up the distro file first (see DEPLOY.md). Runs 6 Node workers on
# 127.0.0.1:5001-5006 behind least_conn, with a 300 GB NVMe proxy cache for
# /p/ (playlists + segments) and /embed/ (free-mode pages).
#
# Requires SHARED_SEGMENT_TOKENS=1 in the app .env: every worker then mints
# byte-identical URLs, so the cache stores one copy per object.

# Debian/Ubuntu ships www-data; RHEL uses nginx.
user www-data;
worker_processes auto;
worker_rlimit_nofile 200000;
pid /run/nginx.pid;

events {
    worker_connections 65535;
    multi_accept on;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 10000;
    server_tokens off;
    client_max_body_size 1m;

    # Real client IP from Cloudflare. Refresh the ranges from
    # https://www.cloudflare.com/ips/ whenever they change.
    # include /etc/nginx/cloudflare-ips.conf;
    real_ip_header CF-Connecting-IP;

    log_format mikaza '$remote_addr - [$time_local] "$request" $status '
                       '$body_bytes_sent rt=$request_time urt=$upstream_response_time '
                       'cache=$upstream_cache_status';
    access_log /var/log/nginx/access.log mikaza;
    error_log /var/log/nginx/error.log warn;

    # 300 GB NVMe cache. TTL comes from the app's Cache-Control headers
    # (segments 24 h, playlists 60 s, free-mode embed pages 10 min).
    proxy_cache_path /var/cache/nginx/mikaza
                     levels=1:2
                     keys_zone=mikaza:200m
                     max_size=300g
                     inactive=24h
                     use_temp_path=off
                     manager_sleep=10s;

    upstream mikaza {
        least_conn;
        server 127.0.0.1:5001;
        server 127.0.0.1:5002;
        server 127.0.0.1:5003;
        server 127.0.0.1:5004;
        server 127.0.0.1:5005;
        server 127.0.0.1:5006;
        keepalive 64;
    }

    # Shared proxy defaults for every location.
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_cache_key "$scheme$request_method$host$request_uri";

    server {
        listen 80;
        server_name _;

        # ---- Proxied streams: the shared disk cache ----------------------
        # One upstream fetch per object serves every worker and every viewer.
        # proxy_cache_lock collapses concurrent misses into one fetch.
        location /p/ {
            proxy_pass http://mikaza;
            proxy_cache mikaza;
            proxy_cache_lock on;
            proxy_cache_lock_timeout 15s;
            proxy_cache_lock_age 15s;
            proxy_cache_background_update on;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_force_ranges on;
            proxy_buffering on;
            proxy_buffers 16 64k;
            proxy_buffer_size 64k;
            add_header X-Cache-Status $upstream_cache_status;
        }

        # ---- Embed pages -------------------------------------------------
        # Free + shared mode renders byte-identical HTML for every viewer and
        # sends Cache-Control: public, max-age=600. nginx honors that; legacy
        # (IP-bound) pages send no-cache and are never stored.
        location ~ ^/(embed|player)(/|$) {
            proxy_pass http://mikaza;
            proxy_cache mikaza;
            proxy_cache_lock on;
            proxy_cache_lock_timeout 15s;
            proxy_ignore_headers Set-Cookie;
            proxy_hide_header Set-Cookie;
            add_header X-Cache-Status $upstream_cache_status;
        }

        # ---- Player assets: sendfile, ETag revalidation ------------------
        # Player JS/CSS stay no-cache so fixes reach viewers immediately; the
        # ETag turns reloads into cheap 304s. nginx serves these from disk.
        location /player-assets/ {
            alias /opt/mikaza/src/views/player/;
            expires -1;
            access_log off;
        }

        location = /player-assets/hls.min.js {
            alias /opt/mikaza/src/views/player/vendor/hls.min.js;
            expires 365d;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        location = /hls.min.js {
            alias /opt/mikaza/src/views/hls.min.js;
            expires 365d;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # ---- Everything else: docs, API, downloads, health --------------
        location / {
            proxy_pass http://mikaza;
            proxy_request_buffering off;
        }
    }
}
