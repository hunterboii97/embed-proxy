# MikazaAPI — dedicated-VPS nginx config
#
# Full replacement for /etc/nginx/nginx.conf on a box that only serves Mikaza.
# Back up the distro file first (see DEPLOY.md). Runs 4 Node workers on
# 127.0.0.1:5001-5004 behind least_conn (Cloud M: 4 vCPU), with a 150 GB
# NVMe proxy cache for /p/ (playlists + segments). Embed HTML is the static
# shell (no per-site data); streams, ads and tiers come from the JSON resolve
# call.
#
# Requires SHARED_SEGMENT_TOKENS=1 in the app .env: every worker then mints
# byte-identical URLs, so the cache stores one copy per object.

# Debian/Ubuntu ships www-data; RHEL uses nginx.
user www-data;
worker_processes auto;
worker_rlimit_nofile 200000;
pid /run/nginx.pid;

events {
    worker_connections 65535;
    multi_accept on;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 10000;
    server_tokens off;
    client_max_body_size 1m;

    # Text assets only: player JS/CSS, resolve JSON, playlists. Segments and
    # video stay uncompressed. If upstream already encoded the body nginx
    # passes it through untouched (no double compression).
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/javascript application/json
               application/vnd.apple.mpegurl image/svg+xml;

    # Real client IP from Cloudflare. Cloudflare REWRITES CF-Connecting-IP,
    # so it is only trusted for connections coming from Cloudflare ranges.
    # Create the include first (deploy/update-cloudflare-ips.sh); an empty
    # file is fine for direct/non-Cloudflare setups. This matters for the
    # admin IP allowlist: without it every admin request looks like a CF IP.
    include /etc/nginx/cloudflare-ips.conf;
    real_ip_header CF-Connecting-IP;

    log_format mikaza '$remote_addr - [$time_local] "$request" $status '
                       '$body_bytes_sent rt=$request_time urt=$upstream_response_time '
                       'cache=$upstream_cache_status';
    # Machine-readable line for the admin collector. Rotated by the distro's
    # /etc/logrotate.d/nginx glob (/var/log/nginx/*.log). $uri excludes the
    # query string; the collector never needs token contents.
    log_format mikaza_json escape=json
        '{"ts":$msec,"host":"$host","m":"$request_method","uri":"$uri",'
        '"status":$status,"bytes":$body_bytes_sent,"rt":$request_time,'
        '"cache":"$upstream_cache_status","ref":"$http_referer"}';
    access_log /var/log/nginx/access.log mikaza;
    access_log /var/log/nginx/mikaza-edge.json.log mikaza_json;
    error_log /var/log/nginx/error.log warn;

    # 150 GB NVMe cache. TTL comes from the app's Cache-Control headers
    # (segments 24 h, playlists 60 s).
    proxy_cache_path /var/cache/nginx/mikaza
                     levels=1:2
                     keys_zone=mikaza:100m
                     max_size=150g
                     inactive=24h
                     use_temp_path=off
                     manager_sleep=10s;

    upstream mikaza {
        least_conn;
        server 127.0.0.1:5001;
        server 127.0.0.1:5002;
        server 127.0.0.1:5003;
        server 127.0.0.1:5004;
        keepalive 64;
    }

    # Shared proxy defaults for every location.
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_cache_key "$scheme$request_method$host$request_uri";

    server {
        listen 80;
        server_name _;

        # ---- Proxied streams: the shared disk cache ----------------------
        # One upstream fetch per object serves every worker and every viewer.
        # proxy_cache_lock collapses concurrent misses into one fetch.
        location /p/ {
            proxy_pass http://mikaza;
            proxy_cache mikaza;
            proxy_cache_lock on;
            proxy_cache_lock_timeout 15s;
            proxy_cache_lock_age 15s;
            proxy_cache_background_update on;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_force_ranges on;
            proxy_buffering on;
            proxy_buffers 16 64k;
            proxy_buffer_size 64k;
            add_header X-Cache-Status $upstream_cache_status;
        }

        # ---- Embed pages: static shell, resolve JSON ---------------------
        # The HTML is viewer-independent and cacheable; the ?resolve=1 JSON
        # (tokens, tier, ads) is no-store. nginx's shared cache must not touch
        # either: resolve responses are per-IP.
        location ~ ^/(embed|player)(/|$) {
            proxy_pass http://mikaza;
            proxy_cache off;
        }

        # ---- Admin dashboard + collector APIs ----------------------------
        # Publicly reachable but access-controlled inside the collector
        # (ADMIN_ALLOWED_IPS). Unauthorized clients get a plain 404. SSE needs
        # buffering off and a long read timeout.
        location ^~ /admin {
            limit_except GET { deny all; }
            proxy_pass http://127.0.0.1:5100;
            proxy_cache off;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 60s;
        }

        # ---- Player telemetry beacons (tiny POSTs, never cached) ---------
        location = /telemetry {
            proxy_pass http://127.0.0.1:5100;
            proxy_cache off;
            client_max_body_size 16k;
        }

        # ---- Player assets: sendfile, ETag revalidation ------------------
        # Player JS/CSS stay no-cache so fixes reach viewers immediately; the
        # ETag turns reloads into cheap 304s. nginx serves these from disk.
        location /player-assets/ {
            alias /opt/mikaza/src/views/player/;
            expires -1;
            access_log off;
        }

        location = /player-assets/hls.min.js {
            alias /opt/mikaza/src/views/player/vendor/hls.min.js;
            expires 365d;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        location = /hls.min.js {
            alias /opt/mikaza/src/views/hls.min.js;
            expires 365d;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # ---- Full-file downloads: no buffering, no cache ------------------
        # The worker proxies a multi-GB body straight from the CDN; nginx must
        # not spool it to disk or hold the first bytes back.
        location ^~ /download {
            proxy_pass http://mikaza;
            proxy_cache off;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
        }

        # ---- Everything else: docs, API, downloads, health --------------
        location / {
            proxy_pass http://mikaza;
            proxy_request_buffering off;
        }
    }

    # Loopback-only stub_status for the admin collector (active connections
    # and lifetime request count). Never expose this listen port publicly.
    server {
        listen 127.0.0.1:8099;
        server_name _;
        access_log off;
        location = /nginx_status {
            stub_status;
            allow 127.0.0.1;
            deny all;
        }
        location / {
            return 404;
        }
    }
}
