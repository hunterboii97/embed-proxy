# MikazaAPI VPS network/VM tuning.
# Install as /etc/sysctl.d/99-mikaza.conf, then: sysctl --system
# BBR requires kernel >= 4.9 (check: sysctl net.ipv4.tcp_congestion_control).

# Congestion control + queueing
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr

# Connection accept backlog (nginx worker_connections = 65535)
net.core.somaxconn = 65535
net.ipv4.tcp_max_syn_backlog = 65535
net.core.netdev_max_backlog = 16384

# Socket buffers (16 MB ceiling for long-fat-pipe segment streaming)
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216
net.ipv4.tcp_rmem = 4096 87380 16777216
net.ipv4.tcp_wmem = 4096 65536 16777216

# Connection churn
net.ipv4.tcp_tw_reuse = 1
net.ipv4.tcp_fin_timeout = 15
net.ipv4.tcp_fastopen = 3

# File descriptors
fs.file-max = 2097152

# Keep the node in RAM; NVMe write batching
vm.swappiness = 10
vm.dirty_ratio = 15
vm.dirty_background_ratio = 5
